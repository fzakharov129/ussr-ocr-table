Global:
  model_name: cyrillic_PP-OCRv5_mobile_rec
  use_gpu: false
  character_dict_path: ppocrv5_cyrillic_dict.txt
  use_space_char: true
  max_text_length: 25
  d2s_train_image_shape:
  - 3
  - 48
  - 320
  restrict_output_symbols: true
  allowed_characters: '0123456789.'
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 25
PostProcess:
  name: CTCLabelDecode
